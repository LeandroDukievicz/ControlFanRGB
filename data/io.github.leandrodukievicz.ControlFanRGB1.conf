<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Só o root publica o serviço. -->
  <policy user="root">
    <allow own="io.github.leandrodukievicz.ControlFanRGB1"/>
  </policy>

  <!--
    Qualquer usuário local pode chamar os métodos. Isso é deliberado e não
    amplia nada: o próprio módulo facer já cria /dev/acer-gkbbl-* com 0666, e
    todas as operações aqui são benignas (luz do teclado e velocidade de
    ventoinha). Quando o projeto virar pacote, isto vira polkit com regra
    separada para o turbo.
  -->
  <policy context="default">
    <allow send_destination="io.github.leandrodukievicz.ControlFanRGB1"/>
  </policy>
</busconfig>
