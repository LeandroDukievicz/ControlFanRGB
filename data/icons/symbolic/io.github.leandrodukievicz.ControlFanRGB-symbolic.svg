<?xml version="1.0" encoding="UTF-8"?>
<!--
  Variante simbólica, para o tray e as notificações.

  Ícone simbólico é monocromático por contrato: o tema recolore conforme o
  fundo, então aqui não entra nenhuma das cores das zonas. A grade é reduzida
  a 4 teclas por fileira (uma por zona) porque em 16 px oito colunas viram
  uma mancha. Os dois traços abaixo da placa são a luz vazando.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#2e3436">
    <!-- placa -->
    <path d="M2 3.5h12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1zm0 1.2a.3.3 0 0 0-.3.3v5.4c0 .17.13.3.3.3h12a.3.3 0 0 0 .3-.3V5a.3.3 0 0 0-.3-.3z"/>
    <!-- teclas: uma por zona -->
    <rect x="3" y="6" width="2" height="1.5" rx="0.4"/>
    <rect x="6" y="6" width="2" height="1.5" rx="0.4"/>
    <rect x="9" y="6" width="2" height="1.5" rx="0.4"/>
    <rect x="12" y="6" width="1" height="1.5" rx="0.4"/>
    <!-- barra de espaço -->
    <rect x="5" y="8.6" width="6" height="1.2" rx="0.5"/>
    <!-- luz vazando por baixo -->
    <rect x="3" y="12.6" width="10" height="1" rx="0.5" opacity="0.75"/>
    <rect x="5" y="14.2" width="6" height="0.9" rx="0.45" opacity="0.4"/>
  </g>
</svg>
