<?xml version="1.0" encoding="UTF-8"?>
<!--
  Variante para tamanhos pequenos (16-32 px).

  O ícone grande tem oito colunas de teclas, que a 24 px borram numa mancha
  só. Aqui sobra o essencial: quatro blocos de cor, um por zona física, com a
  luz vazando por baixo. A quatro blocos, a leitura "teclado RGB de 4 zonas"
  sobrevive ao tamanho.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#333a56"/><stop offset="1" stop-color="#0f111a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect x="3" y="33" width="42" height="12" fill="url(#fade)"/></mask>
  </defs>

  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#f)"/>

  <!-- luz das 4 zonas por baixo -->
  <g mask="url(#m)">
    <rect x="3"  y="33" width="10.5" height="12" fill="#ff2d6f"/>
    <rect x="13.5" y="33" width="10.5" height="12" fill="#b14aed"/>
    <rect x="24" y="33" width="10.5" height="12" fill="#4f7cff"/>
    <rect x="34.5" y="33" width="10.5" height="12" fill="#2de2ff"/>
  </g>

  <!-- placa -->
  <rect x="7" y="13" width="34" height="21" rx="4" fill="#3d4459"/>

  <!-- quatro blocos, um por zona: é o que sobrevive a 24 px -->
  <rect x="10"   y="17" width="6.5" height="13" rx="1.8" fill="#ff2d6f"/>
  <rect x="17.8" y="17" width="6.5" height="13" rx="1.8" fill="#b14aed"/>
  <rect x="25.6" y="17" width="6.5" height="13" rx="1.8" fill="#4f7cff"/>
  <rect x="33.4" y="17" width="6.5" height="13" rx="1.8" fill="#2de2ff"/>
</svg>
